server:
  port: 0

anthropic:
  api:
    key: test-key-placeholder
    base-url: https://api.anthropic.com
    model: claude-sonnet-4-6
    max-tokens: 1024
    version: "2023-06-01"

chroma:
  host: localhost
  port: 8001
  collection-name: pharma_drugs_test

openfda:
